---
- name: Converge
  hosts: all
  become: true
  vars:
    local_user: swimmy
    # 本番では common.yml の pre_tasks が site_vars/<拠点>.yml から読み込む値
    root_password: test_root_password
    googledrive_password: test_googledrive_password
  pre_tasks:
    - name: "{{ local_user }} ユーザーを作成する（テスト用）"
      ansible.builtin.user:
        name: "{{ local_user }}"
        state: present
  roles:
    - document

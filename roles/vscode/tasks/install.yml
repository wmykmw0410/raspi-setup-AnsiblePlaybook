---
- name: 必要パッケージインストール
  ansible.builtin.apt:
    name:
      - wget
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true

- name: Microsoft GPGキー追加
  ansible.builtin.shell:
    cmd: set -o pipefail && wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/microsoft.gpg

- name: VSCode リポジトリ追加
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vscode.list
    content: |
      deb [arch=arm64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main
    mode: "0644"

- name: apt update
  ansible.builtin.apt:
    update_cache: true

- name: VS Code インストール
  ansible.builtin.apt:
    name: code
    state: present

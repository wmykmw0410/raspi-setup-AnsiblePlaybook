---
- name: 拡張機能リスト読み込み
  ansible.builtin.set_fact:
    vscode_extensions: "{{ lookup('file', role_path ~ '/files/extensions.txt').splitlines() | reject('match', '^#') | reject('equalto', '') | list }}"

- name: インストール済み拡張機能を取得する
  become: true
  become_user: "{{ vscode_user }}"
  ansible.builtin.command: code --list-extensions
  register: vscode_installed_extensions
  changed_when: false

- name: VSCode 拡張機能インストール
  become: true
  become_user: "{{ vscode_user }}"
  ansible.builtin.command: code --install-extension {{ item }}
  loop: "{{ vscode_extensions }}"
  when: item not in vscode_installed_extensions.stdout_lines
  changed_when: true
  register: vscode_extension_install
  retries: 3
  delay: 5
  until: vscode_extension_install is succeeded
  ignore_errors: true

- name: 拡張機能のインストール失敗を報告する
  ansible.builtin.fail:
    msg: >-
      以下の拡張機能のインストールに失敗しました:
      {{ vscode_extension_install.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}
  when:
    - vscode_extension_install.results is defined
    - vscode_extension_install.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0

---
- name: Chromium managed policies ディレクトリを作成する
  ansible.builtin.file:
    path: /etc/chromium/policies/managed
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Chromium ホームページポリシーを配置する
  ansible.builtin.copy:
    src: policy.json
    dest: /etc/chromium/policies/managed/policy.json
    owner: root
    group: root
    mode: "0644"

---
- name: Chromium 起動フラグディレクトリを作成する
  ansible.builtin.file:
    path: /etc/chromium.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Chromium にパスワードストアを basic に固定するフラグを配置する
  ansible.builtin.copy:
    content: |
      CHROMIUM_FLAGS="$CHROMIUM_FLAGS --password-store=basic"
    dest: /etc/chromium.d/password-store-basic
    owner: root
    group: root
    mode: "0644"

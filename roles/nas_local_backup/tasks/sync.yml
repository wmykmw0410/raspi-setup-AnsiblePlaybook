---
- name: rsync をインストールする
  ansible.builtin.apt:
    name: rsync
    state: present

- name: "{{ nas_mount }} の内容を {{ backup_mount }} へ同期する"
  ansible.builtin.command: "rsync -a --delete {{ nas_mount }}/ {{ backup_mount }}/"
  changed_when: true

- name: "{{ nas_mount }} を {{ backup_mount }} へ同期するcronジョブを登録する"
  ansible.builtin.cron:
    name: "NAS共有フォルダをバックアップ用USBへrsyncする（{{ item.hour }}:{{ item.minute }}）"
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    job: "rsync -a --delete {{ nas_mount }}/ {{ backup_mount }}/ >> /var/log/nas_backup_sync.log 2>&1"
    user: root
  loop: "{{ nas_local_backup_sync_times }}"

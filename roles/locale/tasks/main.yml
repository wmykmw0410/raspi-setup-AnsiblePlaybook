---
- name: localesパッケージインストール
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true

- name: locale.gen に日本語追加
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    line: "ja_JP.UTF-8 UTF-8"
    state: present

- name: locale生成
  ansible.builtin.command: locale-gen

- name: デフォルトlocale設定
  ansible.builtin.command: update-locale LANG=ja_JP.UTF-8

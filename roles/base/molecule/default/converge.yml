---
- name: Converge
  hosts: all
  become: true
  vars:
    local_user: swimmy
  pre_tasks:
    # Raspberry Pi OS には標準で存在するグループだが、テスト用イメージにはないため作成する
    - name: input グループを作成する（テスト用）
      ansible.builtin.group:
        name: input
        state: present
    - name: "{{ local_user }} ユーザーを作成する（テスト用）"
      ansible.builtin.user:
        name: "{{ local_user }}"
        state: present
  roles:
    - base

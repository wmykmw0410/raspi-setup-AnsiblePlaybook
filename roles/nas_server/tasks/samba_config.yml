---
- name: smb.conf をテンプレートからデプロイする
  ansible.builtin.template:
    src: smb.conf
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify: smbd を再起動する
  tags: samba_config

- name: smbd を起動・自動起動に設定する
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true
  tags: samba_config

---
- name: Ansible をインストールする
  ansible.builtin.apt:
    name: ansible
    state: present
  tags: ansible_install

- name: "{{ nas_mount }} マウントポイントを作成する"
  ansible.builtin.file:
    path: "{{ nas_mount }}"
    state: directory
    mode: "0755"
  tags: usb_mount

- name: "{{ usb_device }} を {{ nas_mount }} にマウントして fstab に登録する"
  ansible.builtin.mount:
    path: "{{ nas_mount }}"
    src: "{{ usb_device }}"
    fstype: exfat
    opts: defaults,nofail,umask=000
    state: mounted
    dump: "0"
    passno: "0"
  tags: usb_mount

- name: Samba と exFAT サポートをインストールする
  ansible.builtin.apt:
    name:
      - samba
      - exfatprogs
    state: present
  tags: samba_install

- name: "{{ samba_user }} システムユーザーを作成する"
  ansible.builtin.user:
    name: "{{ samba_user }}"
    shell: /usr/sbin/nologin
    create_home: false
  tags: samba_user

- name: "{{ samba_user }} の Samba パスワードを設定する"
  ansible.builtin.shell:
    cmd: "pdbedit -L | grep -q '^{{ samba_user }}:' || printf '{{ samba_password }}\n{{ samba_password }}\n' | smbpasswd -a -s {{ samba_user }}"
  no_log: true
  changed_when: true
  tags: samba_user

- name: "{{ samba_user }} を有効化する"
  ansible.builtin.shell:
    cmd: "smbpasswd -e {{ samba_user }}"
  changed_when: true
  tags: samba_user

- name: smb.conf をテンプレートからデプロイする
  ansible.builtin.template:
    src: smb.conf
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  tags: samba_config

- name: smbd を再起動・自動起動に設定する
  ansible.builtin.service:
    name: smbd
    state: restarted
    enabled: true
  tags: samba_config
